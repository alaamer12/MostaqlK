name: Build and Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release-windows:
    name: Build & Release Windows (Portable)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Install MAUI Workloads
        run: dotnet workload install maui-windows
        
      - name: Build Windows
        run: pwsh ./scripts/build.ps1 -Platform Windows
        
      - name: Run GitHub Release Automation
        id: release_step
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/github-release.ps1 -Arch x64

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && steps.release_step.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_step.outputs.tag }}
          name: ${{ steps.release_step.outputs.release_title }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.release_step.outputs.artifact_exe }}
            ${{ steps.release_step.outputs.artifact_zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MostaqlK-Windows
          path: |
            release_artifacts/*
            bin/Release/net10.0-windows10.0.19041.0/**/publish/

  build-android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Install MAUI Workloads
        run: dotnet workload install maui-android
        
      - name: Build Android
        run: pwsh ./scripts/build.ps1 -Platform Android
        
      - name: Release Android
        run: pwsh ./scripts/deploy.ps1 -Platform Android
        
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MostaqlK-Android
          path: bin/Release/net10.0-android/**/publish/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Install MAUI Workloads
        run: dotnet workload install maui-maccatalyst
        
      - name: Build macOS
        run: pwsh ./scripts/build.ps1 -Platform macOS
        
      - name: Release macOS
        run: pwsh ./scripts/deploy.ps1 -Platform macOS
        
      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MostaqlK-macOS
          path: bin/Release/net10.0-maccatalyst/**/publish/

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          
      - name: Install MAUI Workloads
        run: dotnet workload install maui-ios
        
      - name: Build iOS
        run: pwsh ./scripts/build.ps1 -Platform iOS
        
      - name: Release iOS
        run: pwsh ./scripts/deploy.ps1 -Platform iOS
        
      - name: Upload iOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MostaqlK-iOS
          path: bin/Release/net10.0-ios/**/publish/
