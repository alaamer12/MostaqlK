<!DOCTYPE html>
<!--
  MostaqlK — first-run onboarding, v3 multi-source proposal.

  The OLD wizard, re-voiced for multi-platform, then given an accessible Medium
  pass: same one-column simplicity (illustration panel, badge, accented heading,
  description, next/back, step dots; topbar is brand + تخطي only), but with a
  real elevation system, named decision groups on step 5, state carried by
  words not opacity, and touch-sized hit areas.

  Step 5 replaces the Mostaql-only query field with two named groups:
  platform switch-cards (multi-select, at-least-one lock) and interest chips.
  No "you can enable it later" comfort copy anywhere.

  Steps (mirrors OnboardingViewModel, TotalSteps = 6):
    1 نرصد مشاريع المنصات لحظة نشرها      (re-voiced for multi-platform)
    2 تنبيهات فورية عند وصول الجديد
    3 أرشيفك المحلي يبقى معك
    4 ابحث بذكاء عن الفرص المناسبة
    5 أي المنصات تراقب؟                    (platform switches + interest chips)
    6 جاهز؟ لنبدأ الرصد

  Illustrations: the old app shipped PNGs per step. Here each slot carries a
  one-paragraph Arabic brief instead, for later generation with GenImage.

  URL state
    ?step=1..6
    ?platforms=mostaql,nafezly    selected on step 5; at least one; drives brand hue
    ?interests=development,design   selected on step 5; none selected = كل المجالات
    ?theme=light|dark             reviewer-only affordance, no on-screen control
    ?done=1                       completed screen (reached by completing step 6)

  Review URLs
    onboarding.html
    onboarding.html?step=5&theme=dark
    onboarding.html?step=5&platforms=nafezly&interests=development,design
    onboarding.html?step=6
-->
<html dir="rtl" lang="ar" data-platform="mostaql">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>مستقلك — التعريف بالتطبيق</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet"/>
<style data-purpose="tokens">
    :root {
        --brand: #2386C8;
        --brand-ink: #1A6DA6;
        --brand-soft: #EFF6FB;
        --brand-on: #ffffff;
        --bg-app: #f1f5f9;
        --surface: #ffffff;
        --surface-sunk: #f8fafc;
        --ink-1: #0f172a;
        --ink-2: #475569;
        --ink-3: #64748b;
        --line: #e2e8f0;
        --positive: #15803d;
        --shadow-1: 0 1px 2px rgba(15, 23, 42, .05), 0 4px 12px rgba(15, 23, 42, .06);
        --shadow-2: 0 2px 4px rgba(15, 23, 42, .05), 0 14px 32px rgba(15, 23, 42, .12);
        --r-md: 14px;
        --r-lg: 20px;
        --r-xl: 26px;
    }
    html[data-platform="nafezly"] { --brand: #FFA200; --brand-ink: #8a5800; --brand-soft: #FFF4DE; --brand-on: #3a2a00; --mark-bg: #FFA200; --mark-on: #3a2a00; --btn-bg: #FFA200; --btn-on: #3a2a00; }
    :root { --mark-bg: #1A6DA6; --mark-on: #ffffff; --btn-bg: #1A6DA6; --btn-on: #ffffff; }
    html.dark {
        --bg-app: #020617;
        --surface: #0f172a;
        --surface-sunk: #172032;
        --ink-1: #f1f5f9;
        --ink-2: #cbd5e1;
        --ink-3: #94a3b8;
        --line: #334155;
        --positive: #4ade80;
        --shadow-1: 0 1px 2px rgba(0, 0, 0, .35), 0 4px 12px rgba(0, 0, 0, .30);
        --shadow-2: 0 2px 4px rgba(0, 0, 0, .40), 0 14px 32px rgba(0, 0, 0, .45);
    }
    html.dark[data-platform="mostaql"] { --brand: #5CA8DE; --brand-ink: #7dbae8; --brand-soft: rgba(92,168,222,.14); --brand-on: #0b1c2a; --mark-bg: #5CA8DE; --mark-on: #0b1c2a; --btn-bg: #5CA8DE; --btn-on: #0b1c2a; }
    html.dark[data-platform="nafezly"] { --brand: #FFB84D; --brand-ink: #ffca7a; --brand-soft: rgba(255,184,77,.14); --brand-on: #2a1d00; --mark-bg: #FFB84D; --mark-on: #2a1d00; --btn-bg: #FFB84D; --btn-on: #2a1d00; }
</style>
<style data-purpose="layout">
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0;
        font-family: 'Tajawal', sans-serif;
        background: var(--bg-app);
        color: var(--ink-2);
        -webkit-font-smoothing: antialiased;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
    }
    ::selection { background: var(--brand); color: var(--brand-on); }
    button { font-family: inherit; cursor: pointer; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 8px; }

    /* topbar: brand + skip, nothing else */
    .topbar {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 28px;
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 800; color: var(--ink-1); font-size: 17px; }
    .brand .mark {
        width: 36px; height: 36px; border-radius: var(--r-md);
        background: var(--mark-bg); color: var(--mark-on);
        display: grid; place-items: center; font-size: 17px; font-weight: 800;
        box-shadow: var(--shadow-1);
    }
    .skip {
        background: none; border: none; color: var(--ink-2);
        font-size: 14px; font-weight: 700; min-height: 40px; padding: 8px 16px; border-radius: var(--r-md);
    }
    .skip:hover { color: var(--ink-1); background: var(--surface); }

    /* the single centered column */
    main { overflow-y: auto; display: grid; place-items: center; padding: 8px 24px 24px; }
    .wizard { width: min(620px, 100%); text-align: center; }

    /* illustration panel — a designed surface holding the brief until GenImage supplies art */
    .art {
        width: min(360px, 100%); margin: 0 auto 26px;
        border-radius: var(--r-xl); border: 1px solid var(--line);
        background:
            linear-gradient(165deg, var(--brand-soft), transparent 55%),
            var(--surface);
        box-shadow: var(--shadow-1);
        padding: 20px 24px 24px; text-align: right;
    }
    .art-label {
        display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .05em;
        color: var(--brand-ink); background: var(--surface); border: 1px solid var(--line);
        border-radius: 999px; padding: 3px 10px; margin-bottom: 12px;
    }
    .art p { margin: 0; font-size: 14px; line-height: 1.95; color: var(--ink-2); }

    .badge {
        display: inline-flex; align-items: center; gap: 7px;
        background: var(--surface); color: var(--ink-1);
        border: 1px solid var(--line); box-shadow: var(--shadow-1);
        font-size: 12.5px; font-weight: 800;
        padding: 7px 15px; border-radius: 999px; margin-bottom: 16px;
    }
    .badge .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--positive); }

    h1 { margin: 0 0 12px; font-size: clamp(26px, 5vw, 34px); font-weight: 800; color: var(--ink-1); line-height: 1.5; letter-spacing: -.01em; }
    h1 .accent { color: var(--brand-ink); }
    .lede { margin: 0 auto; max-width: 480px; font-size: 16px; line-height: 2; color: var(--ink-2); }

    /* named groups — each decision on step 5 gets a heading and a rule */
    .group { margin: 16px auto 0; max-width: 520px; text-align: right; display: none; }
    .group.on { display: block; }
    .group-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .group-head h2 { margin: 0; font-size: 13.5px; font-weight: 800; color: var(--ink-1); white-space: nowrap; }
    .group-head .rule { flex: 1; height: 1px; background: var(--line); }
    .group-head .count { font-size: 12px; color: var(--ink-2); white-space: nowrap; }

    /* platform switch-cards — one card, one job: this platform, watched or not */
    .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .tile {
        --tile-brand: #2386C8; --tile-on: #fff;
        display: block; background: var(--surface); border: 1.5px solid var(--line);
        border-radius: var(--r-lg); padding: 14px 14px 0; text-align: right; color: var(--ink-2);
        box-shadow: var(--shadow-1);
        transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
    }
    .tile[data-p="nafezly"] { --tile-brand: #FFA200; --tile-on: #3a2a00; --tile-mark: #FFA200; --tile-mark-on: #3a2a00; }
    .tile[data-p="mostaql"] { --tile-mark: #1A6DA6; --tile-mark-on: #fff; }
    html.dark .tile[data-p="mostaql"] { --tile-brand: #5CA8DE; --tile-mark: #5CA8DE; --tile-mark-on: #0b1c2a; }
    html.dark .tile[data-p="nafezly"] { --tile-brand: #FFB84D; --tile-mark: #FFB84D; --tile-mark-on: #2a1d00; }
    .tile .t-top { display: flex; align-items: flex-start; gap: 11px; }
    .tile .t-id { display: flex; align-items: center; gap: 11px; min-width: 0; }
    .tile .t-mark {
        width: 42px; height: 42px; border-radius: var(--r-md); flex-shrink: 0;
        display: grid; place-items: center;
        background: var(--tile-mark); color: var(--tile-mark-on); font-weight: 800; font-size: 18px;
    }
    .tile .t-name { font-weight: 800; color: var(--ink-1); font-size: 16px; }
    .tile .t-tag { font-size: 12px; color: var(--ink-3); margin-top: 2px; line-height: 1.6; }
    .tile .t-sw { margin-inline-start: auto; margin-top: 9px; }
    .tile .t-desc { margin: 12px 0 0; font-size: 13px; line-height: 1.8; }
    .tile .t-foot {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        margin: 12px -14px 0; padding: 9px 14px;
        border-top: 1px solid var(--line); background: var(--surface-sunk);
        border-radius: 0 0 calc(var(--r-lg) - 3px) calc(var(--r-lg) - 3px);
        font-size: 12px; color: var(--ink-3);
    }
    .t-state { font-weight: 800; color: var(--ink-3); }
    .t-state::before { content: '○ '; }
    .tile.on { border-color: var(--tile-brand); box-shadow: var(--shadow-2); }
    .tile.on .t-state { color: var(--positive); }
    .tile.on .t-state::before { content: '● '; }
    .t-sw {
        position: relative; width: 44px; height: 26px; flex-shrink: 0;
        border-radius: 999px; background: var(--line); transition: background-color .15s ease;
    }
    .t-sw::after {
        content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px;
        border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25);
        transition: translate .15s ease;
    }
    .tile.on .t-sw { background: var(--tile-brand); }
    .tile.on .t-sw::after { translate: -18px 0; }
    .choice-note {
        display: none; margin: 12px 0 0; font-size: 12.5px; color: var(--ink-1); text-align: right;
        background: var(--surface-sunk); border: 1px solid var(--line);
        border-radius: var(--r-md); padding: 9px 13px;
    }
    .choice-note.on { display: block; }

    /* interest chips — selected carries a check, not only a color */
    .int-hint { margin: 0 0 12px; font-size: 13px; line-height: 1.8; color: var(--ink-2); }
    .int-hint b, .int-hint .b { color: var(--ink-1); font-weight: 800; }
    .chips { display: flex; flex-wrap: wrap; gap: 9px; }
    .chip {
        display: inline-flex; align-items: center; gap: 7px; min-height: 42px;
        border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2);
        border-radius: 999px; padding: 8px 18px; font-size: 13.5px; font-weight: 700;
        box-shadow: var(--shadow-1);
        transition: border-color .15s ease, background-color .15s ease, color .15s ease;
    }
    .chip:hover { border-color: var(--ink-3); }
    .chip .tick { display: none; font-weight: 800; color: var(--brand-ink); }
    .chip.on { border-color: var(--brand); background: var(--brand-soft); color: var(--ink-1); }
    .chip.on .tick { display: inline; }

    /* navigation — fixed zone, unchanged */
    .nav { display: flex; justify-content: space-between; gap: 12px; margin: 22px auto 0; max-width: 520px; }
    .btn {
        border-radius: var(--r-md); font-size: 15px; font-weight: 800;
        min-height: 46px; padding: 12px 30px; border: 1.5px solid transparent;
    }
    .btn-primary { background: var(--btn-bg); color: var(--btn-on); box-shadow: var(--shadow-1); }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink-2); }
    .btn-ghost:hover { border-color: var(--ink-3); }
    .btn[hidden] { display: none; }

    /* step dots — small marks, 26px hit areas */
    .dots { display: flex; justify-content: center; gap: 2px; padding: 18px 0 24px; }
    .dots .dot {
        width: 26px; height: 26px; display: grid; place-items: center;
        background: none; border: none; padding: 0;
    }
    .dots .dot::before {
        content: ''; width: 8px; height: 8px; border-radius: 999px; background: var(--line);
        transition: width .2s ease, background .2s ease;
    }
    .dots .dot.cur::before { width: 26px; background: var(--brand); }

    /* done state replaces the wizard body */
    .done { display: none; text-align: center; }
    .done.on { display: block; }
    .wizard.off { display: none; }
    .done .tick {
        width: 88px; height: 88px; margin: 0 auto 22px; border-radius: 999px;
        background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-2);
        color: var(--positive); display: grid; place-items: center; font-size: 40px; font-weight: 800;
    }

    /* step transition — direction-aware slide, same feel as the app's choreography */
    .slide-exit-fwd { animation: outL .18s ease forwards; }
    .slide-exit-back { animation: outR .18s ease forwards; }
    .slide-enter-fwd { animation: inR .22s ease; }
    .slide-enter-back { animation: inL .22s ease; }
    @keyframes outL { to { opacity: 0; transform: translateX(-28px); } }
    @keyframes outR { to { opacity: 0; transform: translateX(28px); } }
    @keyframes inR { from { opacity: 0; transform: translateX(28px); } }
    @keyframes inL { from { opacity: 0; transform: translateX(-28px); } }
    @media (prefers-reduced-motion: reduce) {
        .slide-exit-fwd, .slide-exit-back, .slide-enter-fwd, .slide-enter-back { animation: none; }
        .tile, .t-sw, .t-sw::after, .chip, .dots .dot::before { transition: none; }
    }

    @media (max-width: 640px) {
        .topbar { padding: 12px 16px; }
        main { padding: 4px 16px 20px; }
        .choice { grid-template-columns: 1fr; }
        .art { width: 100%; }
    }
</style>
</head>
<body>
<header class="topbar">
    <div class="brand"><span class="mark">م</span> مستقلك</div>
    <button class="skip" id="skipBtn" type="button">تخطي</button>
</header>

<main>
    <section class="wizard" id="wizard" aria-live="polite">
        <div class="art">
            <span class="art-label">وصف الرسم التوضيحي</span>
            <p id="artBrief"></p>
        </div>
        <div class="badge" id="badge"><span class="dot"></span><span id="badgeText">فحص مستمر</span></div>
        <h1 id="title"></h1>
        <p class="lede" id="desc"></p>

        <div class="group" id="platformGroup">
            <div class="group-head">
                <h2>المنصات</h2>
                <span class="rule"></span>
                <span class="count" id="platformCount"></span>
            </div>
            <div class="choice">
                <button class="tile" data-p="mostaql" role="switch" aria-checked="true" type="button">
                    <div class="t-top">
                        <div class="t-id">
                            <span class="t-mark">م</span>
                            <div>
                                <div class="t-name">مستقل</div>
                                <div class="t-tag">أكبر سوق للمشروعات العربية</div>
                            </div>
                        </div>
                        <span class="t-sw" aria-hidden="true"></span>
                    </div>
                    <p class="t-desc">مشروعات بالتحرير والمزايدة في التصميم والبرمجة والكتابة.</p>
                    <div class="t-foot">
                        <span class="t-state">قيد المراقبة</span>
                        <span>فحص كل 30 ثانية</span>
                    </div>
                </button>
                <button class="tile" data-p="nafezly" role="switch" aria-checked="true" type="button">
                    <div class="t-top">
                        <div class="t-id">
                            <span class="t-mark">ن</span>
                            <div>
                                <div class="t-name">نفذلي</div>
                                <div class="t-tag">خدمات مصغّرة جاهزة للتنفيذ</div>
                            </div>
                        </div>
                        <span class="t-sw" aria-hidden="true"></span>
                    </div>
                    <p class="t-desc">خدمات سريعة محددة السعر والنطاق في التصميم والبرمجة.</p>
                    <div class="t-foot">
                        <span class="t-state">قيد المراقبة</span>
                        <span>فحص كل 60 ثانية</span>
                    </div>
                </button>
            </div>
            <p class="choice-note" id="choiceNote">يجب أن تبقى منصة واحدة على الأقل قيد المراقبة.</p>
        </div>

        <div class="group" id="interestGroup">
            <div class="group-head">
                <h2>مجالات اهتمامك</h2>
                <span class="rule"></span>
                <span class="count" id="interestCount"></span>
            </div>
            <p class="int-hint" id="intHint"></p>
            <div class="chips" id="chips"></div>
        </div>

        <div class="nav">
            <button class="btn btn-ghost" id="backBtn" type="button">رجوع</button>
            <button class="btn btn-primary" id="nextBtn" type="button">التالي</button>
        </div>
    </section>

    <section class="done" id="done">
        <div class="tick">✓</div>
        <h1>تم — نرصد <span class="accent" id="donePlatforms">مستقل ونفذلي</span></h1>
        <p class="lede" id="doneLede"></p>
        <div class="nav" style="justify-content:center">
            <button class="btn btn-primary" id="enterBtn" type="button">ابدأ الاستخدام</button>
        </div>
    </section>
</main>

<nav class="dots" id="dots" aria-label="خطوات التعريف"></nav>

<script data-purpose="wizard">
(() => {
    'use strict';

    const TOTAL = 6;
    const PLATFORMS = { mostaql: 'مستقل', nafezly: 'نفذلي' };
    const PLATFORM_KEYS = Object.keys(PLATFORMS);
    const INTERESTS = [
        { key: 'development', name: 'البرمجة والتطوير' },

        { key: 'writing-translation', name: 'الكتابة والترجمة' },

        { key: 'training', name: 'التدريب والتعليم' },

        {
            badge: 'فحص مستمر',

            accent: 'لحظة نشرها',
            titleAfter: '',
            desc: 'يتفحص التطبيق منصّاتك المختارة بشكل دوري من الخلفية، فتصلك المشاريع الجديدة قبل أن يسبقك إليها أحد — دون أي تدخل منك.',
            art: 'شاشة تطبيق داكنة تتوهج فيها بطاقة مشروع حديث الوصول، وسهم رفيع يشير إلى لحظة النشر على خط زمني أفقي.',

            art: 'عدسة مكبّرة فوق شبكة بطاقات، البطاقات المطابقة ملوّنة بلون المنصة والبقية باهتة خلفها.',

        {

            titleBefore: 'أي المنصات ',
            accent: 'تراقب؟',
            titleAfter: '',
            desc: 'شغّل كل منصة تريد رصد مشاريعها، وحدّد مجالات اهتمامك — الفحص والتنبيهات ستعمل على ما يطابقها، في كل دورة.',
            art: '',
            choice: true,
        },
        {
            badge: null,
            titleBefore: 'جاهز؟ ',
            accent: 'لنبدأ الرصد',
            titleAfter: '',
            desc: 'كل شيء جاهز. الرصد والتنبيهات تعمل على المنصات والمجالات التي اخترتها.',
            art: 'رادار دائرة خضراء نبضة واحدة في مركزها علامة مشروع متوهجة، وحولها خطّا مستقل ونفذلي يلتقيان في النبضة.',
            final: true,
        },
    ];

    const els = {
        wizard: document.getElementById('wizard'),
        done: document.getElementById('done'),
        art: document.getElementById('artBrief'),
        artBox: document.querySelector('.art'),
        badge: document.getElementById('badge'),
        badgeText: document.getElementById('badgeText'),
        title: document.getElementById('title'),
        desc: document.getElementById('desc'),
        platformGroup: document.getElementById('platformGroup'),
        platformCount: document.getElementById('platformCount'),
        choiceNote: document.getElementById('choiceNote'),
        interestGroup: document.getElementById('interestGroup'),
        interestCount: document.getElementById('interestCount'),
        intHint: document.getElementById('intHint'),
        chips: document.getElementById('chips'),
        back: document.getElementById('backBtn'),
        next: document.getElementById('nextBtn'),
        skip: document.getElementById('skipBtn'),
        dots: document.getElementById('dots'),
        enter: document.getElementById('enterBtn'),
        donePlatforms: document.getElementById('donePlatforms'),
        doneLede: document.getElementById('doneLede'),
    };

    const state = readState();
    let busy = false;

    function readState() {
        const q = new URLSearchParams(location.search);
        const n = parseInt(q.get('step') ?? '', 10);
        const step = Number.isInteger(n) && n >= 1 && n <= TOTAL ? n - 1 : 0;
        const raw = (q.get('platforms') ?? '').split(',').map(s => s.trim()).filter(Boolean);
        let platforms = PLATFORM_KEYS.filter(k => raw.includes(k));
        if (q.has('platforms') && !platforms.length) platforms = [PLATFORM_KEYS[0]];
        if (!q.has('platforms')) platforms = PLATFORM_KEYS.slice();
        const rawInt = (q.get('interests') ?? '').split(',').map(s => s.trim()).filter(Boolean);
        const interests = INTERESTS.map(i => i.key).filter(k => rawInt.includes(k));
        const theme = q.get('theme') === 'dark' ? 'dark' : 'light';
        const done = q.get('done') === '1';
        return { step, platforms, interests, theme, done };
    }

    function urlFor(s) {
        const q = new URLSearchParams();
        if (s.done) q.set('done', '1');
        else if (s.step !== 0) q.set('step', String(s.step + 1));
        if (s.platforms.length !== PLATFORM_KEYS.length) q.set('platforms', s.platforms.join(','));
        if (s.interests.length) q.set('interests', s.interests.join(','));
        if (s.theme === 'dark') q.set('theme', 'dark');
        const qs = q.toString();
        return location.pathname + (qs ? '?' + qs : '');
    }

    function syncUrl(push) {
        const url = urlFor(state);
        if (push) history.pushState(null, '', url);
        else history.replaceState(null, '', url);
    }

    function spanned(text, cls) {
        const el = document.createElement('span');
        if (cls) el.className = cls;
        el.textContent = text;
        return el;
    }

    function platformNames() {
        return state.platforms.map(k => PLATFORMS[k]).join(' و ');
    }

    function interestNames() {
        return INTERESTS.filter(i => state.interests.includes(i.key)).map(i => i.name);
    }

    function render(animateDir) {
        document.documentElement.dataset.platform = state.platforms[0] ?? PLATFORM_KEYS[0];
        document.documentElement.classList.toggle('dark', state.theme === 'dark');

        const finishing = state.done;
        els.wizard.classList.toggle('off', finishing);
        els.done.classList.toggle('on', finishing);
        els.dots.style.visibility = finishing ? 'hidden' : 'visible';
        if (finishing) {
            els.donePlatforms.textContent = platformNames();
            const ints = interestNames();
            els.doneLede.textContent = ints.length
                ? 'بدأ الفحص المستمر. الجديد في ' + ints.join('، ') + ' من ' + platformNames() + ' سيصلك تنبيهه أولًا بأول.'
                : 'بدأ الفحص المستمر. المشاريع الجديدة من ' + platformNames() + ' ستصلك تنبيهاتها أولًا بأول.';
            return;
        }

        const s = STEPS[state.step];
        els.badge.style.display = s.badge ? '' : 'none';
        els.badgeText.textContent = s.badge ?? '';
        els.title.innerHTML = '';
        els.title.append(spanned(s.titleBefore), spanned(s.accent, 'accent'), spanned(s.titleAfter));
        els.desc.textContent = s.desc;

        if (s.art) {
            els.artBox.style.display = '';
            els.art.textContent = s.art;
        } else {
            els.artBox.style.display = 'none';
        }

        els.platformGroup.classList.toggle('on', !!s.choice);
        els.interestGroup.classList.toggle('on', !!s.choice);
        els.choiceNote.classList.remove('on');
        if (s.choice) {
            els.platformCount.textContent = state.platforms.length + ' من ' + PLATFORM_KEYS.length + ' مرقّبة';
            els.platformGroup.querySelectorAll('.tile').forEach((t) => {
                const on = state.platforms.includes(t.dataset.p);
                t.classList.toggle('on', on);
                t.setAttribute('aria-checked', String(on));
                t.querySelector('.t-state').textContent = on ? 'قيد المراقبة' : 'غير مرقّبة';
            });

            const ints = interestNames();
            els.interestCount.textContent = ints.length ? ints.length + ' مختارة' : 'الكل';
            els.intHint.innerHTML = '';
            els.intHint.append(
                spanned('سيصلك الجديد في '),
                spanned(ints.length ? ints.join('، ') : 'كل المجالات', 'b'),
                spanned('.'),
            );
            els.chips.innerHTML = '';
            INTERESTS.forEach((i) => {
                const sel = state.interests.includes(i.key);
                const c = document.createElement('button');
                c.type = 'button';
                c.className = 'chip' + (sel ? ' on' : '');
                c.dataset.key = i.key;
                c.setAttribute('aria-pressed', String(sel));
                const tick = spanned('✓', 'tick');
                tick.setAttribute('aria-hidden', 'true');
                c.append(tick, spanned(i.name));
                els.chips.append(c);
            });
        }

        els.back.hidden = state.step === 0;
        els.next.textContent = s.final ? 'ابدأ الاستخدام' : 'التالي';

        els.dots.innerHTML = '';
        for (let i = 0; i < TOTAL; i++) {
            const d = document.createElement('button');
            d.className = 'dot' + (i === state.step ? ' cur' : '');
            d.type = 'button';
            d.setAttribute('aria-label', `الخطوة ${i + 1}`);
            if (i === state.step) d.setAttribute('aria-current', 'step');
            d.addEventListener('click', () => goTo(i));
            els.dots.append(d);
        }

        if (animateDir) {
            els.wizard.classList.remove('slide-exit-fwd', 'slide-exit-back', 'slide-enter-fwd', 'slide-enter-back');
            void els.wizard.offsetWidth;
            els.wizard.classList.add(animateDir > 0 ? 'slide-enter-fwd' : 'slide-enter-back');
        }
    }

    function goTo(target) {
        if (busy || target === state.step || target < 0 || target >= TOTAL) return;
        busy = true;
        const dir = target > state.step ? 1 : -1;
        els.wizard.classList.add(dir > 0 ? 'slide-exit-fwd' : 'slide-exit-back');
        setTimeout(() => {
            els.wizard.classList.remove('slide-exit-fwd', 'slide-exit-back');
            state.step = target;
            syncUrl(true);
            render(dir);
            busy = false;
        }, 180);
    }

    function complete() {
        state.done = true;
        syncUrl(true);
        render(0);
    }

    els.next.addEventListener('click', () => {
        if (busy) return;
        if (STEPS[state.step].final) complete();
        else goTo(state.step + 1);
    });
    els.back.addEventListener('click', () => goTo(state.step - 1));
    els.skip.addEventListener('click', complete);
    els.enter.addEventListener('click', () => {
        state.done = false;
        state.step = 0;
        syncUrl(true);
        render(0);
    });

    els.platformGroup.addEventListener('click', (e) => {
        const tile = e.target.closest('.tile');
        if (!tile) return;
        const key = tile.dataset.p;
        const on = state.platforms.includes(key);
        if (on && state.platforms.length === 1) {
            els.choiceNote.classList.add('on');
            return;
        }
        els.choiceNote.classList.remove('on');
        state.platforms = on
            ? state.platforms.filter(p => p !== key)
            : PLATFORM_KEYS.filter(p => p === key || state.platforms.includes(p));
        syncUrl(true);
        render(0);
    });

    els.chips.addEventListener('click', (e) => {
        const chip = e.target.closest('.chip');
        if (!chip) return;
        const key = chip.dataset.key;
        state.interests = state.interests.includes(key)
            ? state.interests.filter(k => k !== key)
            : INTERESTS.map(i => i.key).filter(k => k === key || state.interests.includes(k));
        syncUrl(true);
        render(0);
    });

    window.addEventListener('popstate', () => {
        const s = readState();
        state.step = s.step;
        state.platforms = s.platforms;
        state.interests = s.interests;
        state.theme = s.theme;
        state.done = s.done;
        render(0);
    });

    render(0);
    syncUrl(false);
})();
</script>
</body>
</html>
