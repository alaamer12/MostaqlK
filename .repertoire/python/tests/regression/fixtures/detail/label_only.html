<!DOCTYPE html>
<html>
<head><title>مشروع بدون لوحات - مستقل</title></head>
<body>
<h1>مشروع بدون لوحات</h1>

<div id="projectDetailsTab">
  <div class="text-wrapper-div">مطلوب مطور واجهات خبير.</div>
</div>

<!-- Ladder rung 1: next_sibling_of_label -->
<div><em>عدد المقترحات</em><strong>12 عروضا</strong></div>

<!-- Ladder rung 2: next_td (label IS a td; empty th must be skipped) -->
<table class="layout">
  <tr><td>مدة التنفيذ</td><th></th><td>20 يوما</td></tr>
</table>

<!-- Ladder rung 3: parent_next_sibling -->
<ul>
  <li><b>حالة المشروع</b></li>
  <li>منفذ</li>
</ul>

<!-- Ladder rung 4: parent_text_minus_label (isolated container so the NEXT
     section cannot be captured by the parent_next_sibling rung) -->
<div class="posted-sec"><p><span>تاريخ النشر:</span> منذ شهرين</p></div>

<!-- Ladder rung 5: grandparent_sibling_cell (value element PRECEDES the label wrapper) -->
<div class="stat-row">
  <em>3 محادثات</em>
  <div class="lbl"><span>التواصلات الجارية</span></div>
</div>

<a href="/skills/python">Python</a>
<a href="/tag/django">Django</a>
</body>
</html>
