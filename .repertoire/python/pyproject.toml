[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mostaql"
version = "0.1.0"
description = "MostaqlK backbone: headless polling, scraping, and persistence service (Python migration)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lxml>=5.2",
]

[project.scripts]
mostaql = "mostaql.runtime:cli"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    "import-linter>=2.0",
    "radon>=6.0",
    "xenon>=0.9",
    "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mostaql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP", "C4", "SIM", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src/mostaql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src/mostaql"]
branch = true

[tool.coverage.report]
fail_under = 85

[tool.importlinter]
root_packages = ["mostaql"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "pipeline-free-of-storage-and-http"
type = "forbidden"
source_modules = ["mostaql.pipeline"]
forbidden_modules = [
    "mostaql.storage.sqlite_store",
    "mostaql.http",
    "lxml",
    "sqlite3",
]

[[tool.importlinter.contracts]]
name = "pure-leaves"
type = "forbidden"
source_modules = [
    "mostaql.models",
    "mostaql.text",
    "mostaql.errors",
]
forbidden_modules = [
    "mostaql",
    "mostaql.config",
    "mostaql.diagnostics",
    "mostaql.http",
    "mostaql.pipeline",
    "mostaql.runtime",
    "mostaql.scraping",
    "mostaql.storage",
]

[[tool.importlinter.contracts]]
name = "httpx-only-in-http-layer"
type = "forbidden"
source_modules = [
    "mostaql.config",
    "mostaql.diagnostics",
    "mostaql.errors",
    "mostaql.models",
    "mostaql.pipeline",
    "mostaql.runtime",
    "mostaql.scraping",
    "mostaql.storage",
    "mostaql.text",
]
forbidden_modules = ["httpx"]
# Plan §6 sanctions exactly two transitive edges into mostaql.http: the scraper
# (PageFetcher dependency) and the composition root (wires PageFetcher +
# build_default_client). Direct httpx imports anywhere outside mostaql.http
# remain forbidden.
ignore_imports = [
    "mostaql.scraping.scraper -> mostaql.http",
    "mostaql.runtime -> mostaql.http",
]
